        <main>
            <h3 class="animate">Random Stuff I Made</h3>
            <p class="animate">Here are some random things i made when i was bored:</p>

            <label>
                <input type="checkbox" class="option">
                    Try to
                </label>

                <label>
                <input type="checkbox" class="option">
                    Select
                </label>

                <label>
                <input type="checkbox" class="option">
                    All the boxes
                </label>

                <script>
                const options = document.querySelectorAll(".option");
                const selected = [];

                options.forEach(option => {
                    option.addEventListener("change", () => {
                    if (option.checked) {
                        selected.push(option);

                        if (selected.length > 2) {
                        const oldest = selected.shift();
                        oldest.checked = false;
                        }
                    } else {
                        const index = selected.indexOf(option);

                        if (index !== -1) {
                        selected.splice(index, 1);
                        }
                    }
                    });
                });
            </script>
        </main>
    </body>
